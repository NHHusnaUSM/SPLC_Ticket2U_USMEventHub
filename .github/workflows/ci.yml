name: USM Event Hub CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run TDD Unit Assertions
        run: node tests/ticketRegistration.test.js

      - name: Check Report Draft Files Exist
        run: |
          test -f docs/task1_ProcessDefinition_Modelling.md
          test -f docs/task2_RequirementsQuality_AgileUserStories.md
          test -f docs/task3_SymmetricalVerification_Validation.md
          test -f docs/task4_LeanWasteAuditing_XPPracticeAlignment.md
          test -f docs/task5_ProcessTailoring_HumanFactorGovernance.md
          echo "All 5 task report files verified!"

